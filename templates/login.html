<!DOCTYPE html>
<html>

<head>

    <title>Customer Login</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >

</head>

<body>


    <nav class="navbar">

        <a
            href="/"
            class="logo"
        >
            AI With Rocky 🚀
        </a>

    </nav>


    <main class="container">


        <div class="form-card">


            <h1>
                Customer Login 🔐
            </h1>


            {% if error %}

                <div class="alert">

                    {{ error }}

                </div>

            {% endif %}


            <form method="POST">


                <div class="form-group">

                    <label>
                        Email
                    </label>

                    <input
                        type="email"
                        name="email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>
                        Password
                    </label>

                    <input
                        type="password"
                        name="password"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="btn"
                >
                    Login 🔐
                </button>


            </form>


            <p>
                Don't have an account?
            </p>


            <a href="/register">

                Create Account 👤

            </a>


        </div>


    </main>


</body>

</html>
