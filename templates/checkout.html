<!DOCTYPE html>
<html>

<head>

    <title>Checkout</title>

</head>

<body>

    <h1>
        Checkout 📦
    </h1>


    <h2>
        Your Order
    </h2>


    {% for product in cart_products %}

        <p>

            {{ product.name }}

            × {{ product.quantity }}

            = ₹{{ product.subtotal }}

        </p>

    {% endfor %}


    <h2>
        Total:
        ₹{{ total }}
    </h2>


    <hr>


    <h2>
        Delivery Information 🚚
    </h2>


    <form method="POST">


        <label>
            Full Name:
        </label>

        <br>

        <input
            type="text"
            name="name"
            placeholder="Enter your full name"
            required
        >

        <br><br>


        <label>
            Phone Number:
        </label>

        <br>

        <input
            type="tel"
            name="phone"
            placeholder="Enter your phone number"
            required
        >

        <br><br>


        <label>
            Email:
        </label>

        <br>

        <input
            type="email"
            name="email"
            placeholder="Enter your email address"
        >

        <br><br>


        <label>
            Delivery Address:
        </label>

        <br>

        <textarea
            name="address"
            rows="5"
            placeholder="Enter your complete delivery address"
            required
        ></textarea>

        <br><br>


        <button type="submit">

            Place Order 🚀

        </button>


    </form>


    <br>


    <a href="/cart">
        ← Back to Cart
    </a>


</body>

</html>
